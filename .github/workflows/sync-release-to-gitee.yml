name: Sync Release to Gitee

# 将 GitHub Release 及其构建产物同步到 Gitee
# 触发方式：
#   1. 自动：发布 GitHub Release 时触发
#   2. 手动：Actions 页面点击 "Run workflow"，可指定 Tag（留空用最新）
#
# 需在 GitHub 仓库 Settings -> Secrets 中配置：
#   GITEE_TOKEN  - Gitee 私人令牌（设置 -> 私人令牌 -> 生成）
#   GITEE_OWNER  - Gitee 用户名
#   GITEE_REPO   - Gitee 仓库名

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release Tag（留空则同步最新 Release）"
        required: false
        type: string

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      # 统一解析要同步的 Release 信息（兼容自动触发和手动触发，纯 curl + API，无 git 依赖）
      - name: Resolve Release Info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e

          OWNER="${REPO%/*}"
          echo "仓库: ${REPO}"

          # 确定 Tag：手动输入 > 自动触发事件 > 最新 Release
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            LATEST_JSON=$(curl -s -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/latest")
            TAG=$(echo "$LATEST_JSON" | jq -r '.tag_name')
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "未找到可同步的 Release，请先创建 Release"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # 通过 GitHub API 获取 Release 详情（含 body、target、assets 下载地址）
          RELEASE_JSON=$(curl -s -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")

          # 校验 API 是否返回 Release（未认证可能触发限流返回 message）
          if [ "$(echo "$RELEASE_JSON" | jq -r '.tag_name')" != "$TAG" ]; then
            echo "获取 Release 信息失败:"
            echo "$RELEASE_JSON"
            exit 1
          fi

          BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')
          TARGET=$(echo "$RELEASE_JSON" | jq -r '.target_commitish')
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

          # 输出所有资产下载地址（每行一个），供下载步骤使用
          echo "asset_urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_JSON" | jq -r '.assets[]?.browser_download_url' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "将同步 Release: ${TAG} (target: ${TARGET})"

      - name: Download GitHub Release Assets
        env:
          TAG_NAME: ${{ steps.release_info.outputs.tag }}
          ASSET_URLS: ${{ steps.release_info.outputs.asset_urls }}
        run: |
          set -e

          mkdir -p /tmp/assets

          if [ -z "$ASSET_URLS" ]; then
            echo "该 Release 没有构建产物，跳过下载"
            touch /tmp/assets/.no_assets
          else
            echo "$ASSET_URLS" | while IFS= read -r URL; do
              [ -z "$URL" ] && continue
              FILENAME=$(basename "$URL")
              echo "下载: ${FILENAME}"
              curl -sL -o "/tmp/assets/${FILENAME}" "$URL"
            done
          fi

          echo "下载完成:"
          ls -lh /tmp/assets/

      - name: Create Gitee Release
        id: create_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG_NAME: ${{ steps.release_info.outputs.tag }}
          TARGET_COMMITISH: ${{ steps.release_info.outputs.target }}
          RELEASE_BODY: ${{ steps.release_info.outputs.body }}
        run: |
          set -e

          echo "正在 Gitee 创建 Release: ${TAG_NAME}"

          # 转义 Release Body 中的特殊字符，安全嵌入 JSON
          ESCAPED_BODY=$(printf '%s' "$RELEASE_BODY" | jq -Rs .)

          # 在 Gitee 创建 Release
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"${TAG_NAME}\",
              \"body\": ${ESCAPED_BODY},
              \"target_commitish\": \"${TARGET_COMMITISH}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "创建 Gitee Release 失败 (HTTP ${HTTP_CODE})"
            echo "$BODY"
            exit 1
          fi

          # 提取 Gitee Release ID
          RELEASE_ID=$(echo "$BODY" | jq -r '.id')
          echo "Gitee Release 创建成功，ID: ${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload Assets to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          set -e

          echo "正在上传构建产物到 Gitee Release (ID: ${RELEASE_ID})"

          for FILEPATH in /tmp/assets/*; do
            if [ -f "$FILEPATH" ]; then
              FILENAME=$(basename "$FILEPATH")
              echo "上传: ${FILENAME}"

              curl -s -X POST \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                -H "Content-Type: multipart/form-data" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILEPATH}"

              echo ""
              echo "${FILENAME} 上传完成"
            fi
          done

          echo "所有构建产物已同步到 Gitee"
